PluginName="OBS Framebridge"
PluginDescription="Exposes per-frame pixel data of a chosen scene/source to Lua scripts."

SourceName="Source to capture"
SourceNameDescription="The OBS source or scene whose composed output will be captured each frame."
CaptureWidth="Capture width (px)"
CaptureWidthDescription="Width at which the source is rendered internally. Lower values reduce GPU→CPU transfer cost."
CaptureHeight="Capture height (px)"
CaptureHeightDescription="Height at which the source is rendered internally."
EnableCapture="Enable frame capture"
EnableCaptureDescription="Master toggle. When disabled, no GPU rendering or memory copies are performed."
DebugOverlay="Debug overlay"
DebugOverlayDescription="When enabled, log sampled pixel values for the first call each frame (development aid, impacts performance)."
